name: Build Read-Only Diagnostic IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Inspect simulator VI private-framework symbols
        shell: bash
        run: |
          set +e
          echo '=== locating VI private frameworks ==='
          find /Applications /Library/Developer/CoreSimulator -type f \
            \( -path '*/VisualIntelligenceCore.framework/VisualIntelligenceCore' -o \
               -path '*/VisionKitCore.framework/VisionKitCore' -o \
               -path '*/GenerativeModels.framework/GenerativeModels' \) \
            2>/dev/null | head -40 | while IFS= read -r BIN; do
              [ -f "$BIN" ] || continue
              echo "=== FILE: $BIN ==="
              file "$BIN" || true
              echo '--- nm filtered ---'
              nm -nm "$BIN" 2>/dev/null | grep -Ei \
                'GreymatterAvailability|AvailabilityState|AvailabilityKey|UseCaseIdentifier|hasAdditionalChinaPolicy|ChinaPolicy|ChinaRegion|PartnerImageSearch|visualIntelligenceCamera|gvicc|AIAvailability|VKCGMAvailability|deviceIsEligibleForVI|supportsVI|currentWithUseCaseIdentifiers|MobileGestalt|MGCopyAnswer|preheat' \
                | head -1000 || true
              echo '--- strings filtered ---'
              strings -a "$BIN" 2>/dev/null | grep -Ei \
                'GreymatterAvailability|AvailabilityState|AvailabilityKey|UseCaseIdentifier|hasAdditionalChinaPolicy|chinaPolicy|isChinaRegion|PartnerImageSearch|VisualIntelligence\.gvicc|visualIntelligenceCamera|gviccContentClassifier|currentIPCountryCode|AIAvailability|deviceIsEligibleForVI|supportsVI|currentWithUseCaseIdentifiers|MobileGestalt|MGCopyAnswer|preheated|com\.apple\.gms\.availability' \
                | head -1200 || true
            done

      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project GestaltEdit.xcodeproj \
            -scheme GestaltEdit \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$PWD/build/Build/Products/Release-iphoneos/GestaltEdit.app"
          test -d "$APP"
          rm -rf Payload GestaltEdit-ReadOnlyDiagnostic.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          /usr/bin/zip -qry GestaltEdit-ReadOnlyDiagnostic.ipa Payload
          /usr/bin/unzip -l GestaltEdit-ReadOnlyDiagnostic.ipa | head -40

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GestaltEdit-ReadOnlyDiagnostic-IPA
          path: GestaltEdit-ReadOnlyDiagnostic.ipa
          if-no-files-found: error
          retention-days: 7
